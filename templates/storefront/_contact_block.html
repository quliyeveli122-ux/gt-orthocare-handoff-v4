<div class="contact">
  <div class="cinfo">
    <div class="item"><div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
      <div><b>{{ T.cPhone }}</b><a class="v" href="tel:{{ SITE.phone1|cut:' ' }}">{{ SITE.phone1 }}</a><br><a class="v" href="tel:{{ SITE.phone2|cut:' ' }}">{{ SITE.phone2 }}</a></div></div>
    <div class="item"><div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <div><b>{{ T.cHours }}</b><span>{{ T.cHoursV }}</span></div></div>
    <div class="item"><div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div><b>{{ T.cAddr }}</b><span>{{ T.cAddrV }}</span></div></div>
    <div class="item"><div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg></div>
      <div><b>{{ T.cMail }}</b><a class="v" href="mailto:{{ SITE.email }}">{{ SITE.email }}</a></div></div>
  </div>
  <form class="cf" action="{% url 'content:contact' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    <div class="fld"><label>{{ T.fName }}</label><input name="name" required value="{{ form.name.value|default:'' }}">
      {% if form.name.errors %}<div class="err">{{ form.name.errors.0 }}</div>{% endif %}</div>
    <div class="fld"><label>{{ T.fPhone }}</label><input name="phone" type="tel" required value="{{ form.phone.value|default:'' }}">
      {% if form.phone.errors %}<div class="err">{{ form.phone.errors.0 }}</div>{% endif %}</div>
    <div class="fld"><label>{{ T.fMsg }}</label><textarea name="message" rows="4">{{ form.message.value|default:'' }}</textarea></div>
    <button class="btn p" type="submit" style="justify-content:center">{{ T.fSend }}</button>
  </form>
</div>
